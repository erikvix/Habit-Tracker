# APK de release assinado com a keystore do app (a mesma da Expo).
# - tag v* (ex.: v1.2.0): compila e publica uma GitHub Release com o APK;
# - manual (workflow_dispatch): só compila e deixa o APK como artefato do run.
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, typecheck e testes
        run: |
          npx expo lint
          npx tsc --noEmit
          # Cache do Jest começa frio no runner: o 1º teste de UI de cada arquivo passa de 5 s.
          npx jest --ci --testTimeout=30000

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(node -p "require('./app.json').expo.version")-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Versão: $name (versionCode $GITHUB_RUN_NUMBER)"

      - name: Prebuild (gera android/)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}

      - name: Keystore
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build (assembleRelease)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verificar assinatura
        id: apk
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::APK assinado com a keystore de debug; confira os secrets."
            exit 1
          fi
          mkdir -p dist
          out="dist/todo-tracker-v${{ steps.version.outputs.name }}.apk"
          mv "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Remover keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: todo-tracker-v${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: GitHub Release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
